[theme]
base = "light"
primaryColor = "#d7301f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f4f7"
font = "sans serif"

[server]
headless = true
# Hot-reload on file change is a local convenience; keep it off in deployments.
runOnSave = false
enableXsrfProtection = true
enableCORS = false

[browser]
gatherUsageStats = false
